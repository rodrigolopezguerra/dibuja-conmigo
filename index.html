<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dibujá Conmigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2B2B;
    --paper:#FFFBF2;
    --paper-line:#EFE7D3;
    --coral:#FF6B4A;
    --sun:#FFC93C;
    --sky:#4EA8DE;
    --leaf:#4CB963;
    --lavender:#B79CED;
    --panel:#FFFFFF;
    --shadow: 4px 4px 0 rgba(43,43,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:1080px;margin:0 auto;padding:0 0 40px;}
  header{padding:22px 20px 14px;text-align:center;}
  header h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(28px,6vw,40px);
    margin:0 0 4px;
    color:var(--ink);
  }
  header p{margin:0;font-size:15px;font-weight:700;color:#6b6355;}
  .crayon-stripe{
    height:7px;width:100%;
    background: repeating-linear-gradient(90deg,
      var(--coral) 0 26px, var(--sun) 26px 52px,
      var(--sky) 52px 78px, var(--leaf) 78px 104px,
      var(--lavender) 104px 130px);
    border-radius:6px;
  }

  .filters{padding:16px 20px 0; display:flex; flex-direction:column; gap:8px;}
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .filter-row::-webkit-scrollbar{height:6px;}
  .filter-row::-webkit-scrollbar-thumb{background:#e3d9bf;border-radius:8px;}
  .chip{
    flex:0 0 auto; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    background:var(--panel); border:3px solid var(--ink); border-radius:20px;
    padding:6px 14px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--ink); color:#fff;}
  .chip.diff-facil.active{background:var(--leaf); color:#fff;}
  .chip.diff-medio.active{background:var(--sun); color:var(--ink);}
  .chip.diff-dificil.active{background:var(--coral); color:#fff;}

  .gallery{
    display:flex; gap:12px; overflow-x:auto;
    padding:14px 20px 6px; -webkit-overflow-scrolling:touch;
  }
  .gallery::-webkit-scrollbar{height:8px;}
  .gallery::-webkit-scrollbar-thumb{background:#e3d9bf;border-radius:8px;}
  .empty-msg{padding:20px; font-weight:800; color:#a89b7c;}
  .tut-card{
    position:relative;
    flex:0 0 auto; width:86px; background:var(--panel);
    border:3px solid var(--ink); border-radius:16px;
    padding:8px 6px 6px; cursor:pointer; text-align:center;
    box-shadow:var(--shadow); transition:transform .12s ease;
  }
  .tut-card:hover{transform:translateY(-2px);}
  .tut-card.active{background:var(--sun); border-color:var(--ink);}
  .tut-card svg{width:56px;height:56px;}
  .tut-card span.tname{display:block;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;margin-top:2px;line-height:1.2;}
  .diff-dots{display:flex; gap:3px; justify-content:center; margin-top:4px;}
  .diff-dots i{width:6px;height:6px;border-radius:50%; background:#e0d8c3; display:inline-block;}
  .diff-dots i.on.facil{background:var(--leaf);}
  .diff-dots i.on.medio{background:var(--sun);}
  .diff-dots i.on.dificil{background:var(--coral);}

  main.workspace{
    display:grid; grid-template-columns: 1fr 220px; gap:18px;
    padding:10px 20px 0; align-items:start;
  }
  @media (max-width:720px){
    main.workspace{grid-template-columns:1fr;}
  }

  .canvas-wrap{display:flex; flex-direction:column; gap:12px;}
  .board{
    position:relative; width:100%; aspect-ratio:1/1;
    background:var(--panel);
    border:4px solid var(--ink); border-radius:20px;
    box-shadow:var(--shadow); overflow:hidden; touch-action:none;
  }
  .board canvas{position:absolute; inset:0; width:100%; height:100%;}
  .board svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}

  .step-controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:3px solid var(--ink); border-radius:16px;
    padding:10px 14px; box-shadow:var(--shadow);
  }
  .step-controls .dots{display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap;}
  .dot{
    width:14px;height:14px;border-radius:50%; background:#e6ddc6;
    border:2px solid var(--ink); cursor:pointer;
  }
  .dot.filled{background:var(--coral);}
  .dot.current{background:var(--sun);}
  .icon-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    background:var(--sky); color:#fff; border:3px solid var(--ink);
    border-radius:12px; width:38px; height:38px; cursor:pointer; line-height:1;
  }
  .icon-btn:active{transform:translateY(1px);}
  .play-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:var(--coral); color:#fff; border:3px solid var(--ink);
    border-radius:14px; padding:9px 14px; cursor:pointer; white-space:nowrap;
  }
  .play-btn:active{transform:translateY(1px);}
  .guide-toggle{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px;}

  .toolbar{
    background:var(--panel); border:3px solid var(--ink); border-radius:16px;
    padding:14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:14px;
  }
  .toolbar h3{margin:0; font-family:'Baloo 2',sans-serif; font-size:15px;}
  .swatches{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:50%; border:3px solid var(--ink);
    cursor:pointer; padding:0;
  }
  .swatch.selected{outline:3px solid var(--ink); outline-offset:2px;}
  .toolbar label{font-size:13px; font-weight:800;}
  .toolbar input[type=range]{width:100%;}
  .tool-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:var(--paper); color:var(--ink); border:3px solid var(--ink);
    border-radius:12px; padding:9px; cursor:pointer;
  }
  .tool-btn.active{background:var(--leaf); color:#fff;}
  .tool-btn:active{transform:translateY(1px);}
  .save-btn{background:var(--sun);}
  .clear-btn{background:#FF8C7A;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700;
    padding:10px 18px; border-radius:12px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>✏️ Dibujá Conmigo 🎨</h1>
    <p>Elegí un dibujo y aprendé a hacerlo, paso a paso</p>
  </header>
  <div class="crayon-stripe"></div>

  <div class="filters">
    <div class="filter-row" id="category-filters"></div>
    <div class="filter-row" id="difficulty-filters"></div>
  </div>

  <nav class="gallery" id="gallery"></nav>

  <main class="workspace">
    <section class="canvas-wrap">
      <div class="board" id="board">
        <canvas id="draw-canvas"></canvas>
        <svg id="guide-svg" viewBox="0 0 400 400"></svg>
      </div>
      <div class="step-controls">
        <button class="icon-btn" id="prev-step" title="Paso anterior">‹</button>
        <div class="dots" id="step-dots"></div>
        <button class="icon-btn" id="next-step" title="Siguiente paso">›</button>
      </div>
      <div class="step-controls">
        <button class="play-btn" id="play-btn">▶ Ver cómo se dibuja</button>
        <label class="guide-toggle"><input type="checkbox" id="guide-toggle" checked> Mostrar guía</label>
      </div>
    </section>

    <aside class="toolbar">
      <div>
        <h3>Colores</h3>
        <div class="swatches" id="colors"></div>
      </div>
      <div>
        <label for="brush-size">Grosor del pincel</label>
        <input type="range" id="brush-size" min="2" max="28" value="7">
      </div>
      <button class="tool-btn" id="eraser-btn">🧼 Goma</button>
      <button class="tool-btn" id="undo-btn">↩ Deshacer</button>
      <button class="tool-btn clear-btn" id="clear-btn">🗑 Borrar todo</button>
      <button class="tool-btn save-btn" id="save-btn">⬇ Guardar dibujo</button>
    </aside>
  </main>
</div>

<div class="toast" id="toast"></div>

        { d:"M135,240 L160,240 L160,265 L135,265 Z M240,240 L265,240 L265,265 L240,265 Z" },

    { id:"fantasma", name:"Fantasma", emoji:"👻", category:"fantasia", difficulty:"facil", steps:[

    { id:"robot", name:"Robot", emoji:"🤖", category:"fantasia", difficulty:"medio", steps:[

        { d:"M200,140 L200,110 M190,110 L210,110 M165,175 L185,175 L185,195 L165,195 Z M215,175 L235,175 L235,195 L215,195 Z" },
        { d:"M150,235 L250,235 L250,320 L150,320 Z M220,270 a20,20 0 1,0 -40,0 a20,20 0 1,0 40,0" },
        { d:"M150,250 L110,250 L110,280 L130,280 L130,250 M250,250 L290,250 L290,280 L270,280 L270,250 M170,320 L170,360 L190,360 L190,320 M210,320 L210,360 L230,360 L230,320" },
        { d:"M160,210 L180,210 M190,210 L210,210 M220,210 L240,210" }
      ]},
    { id:"dinosaurio", name:"Dinosaurio", emoji:"🦕", category:"fantasia", difficulty:"dificil", steps:[
        { d:"M290,240 A80,55 0 1,1 130,240 A80,55 0 1,1 290,240" },
        { d:"M170,200 Q120,150 90,110 Q80,95 95,85 Q115,80 130,100 Q160,140 190,190 M110,95 a15,15 0 1,0 -30,0 a15,15 0 1,0 30,0" },
        { d:"M270,220 Q340,210 380,180" },
        { d:"M160,290 L160,330 L180,330 L180,290 M230,290 L230,330 L250,330 L250,290 M190,295 L190,335 L210,335 L210,295 M255,295 L255,335 L275,335 L275,295" },
        { d:"M100,90 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 M170,210 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 M210,210 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 M250,215 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" }
      ]},
    { id:"castillo", name:"Castillo", emoji:"🏰", category:"fantasia", difficulty:"dificil", steps:[
        { d:"M110,220 L290,220 L290,340 L110,340 Z" },
        { d:"M90,180 L140,180 L140,340 L90,340 Z M260,180 L310,180 L310,340 L260,340 Z" },
        { d:"M100,220 L100,200 L120,200 L120,220 M150,220 L150,200 L170,200 L170,220 M190,220 L190,200 L210,200 L210,220 M230,220 L230,200 L250,200 L250,220 M270,220 L270,200 L290,200 L290,220 M90,180 L115,150 L140,180 Z M260,180 L285,150 L310,180 Z" },
        { d:"M180,340 L180,280 Q180,260 200,260 Q220,260 220,280 L220,340 Z M105,220 L125,220 L125,240 L105,240 Z M275,220 L295,220 L295,240 L275,240 Z" },
        { d:"M115,150 L115,130 L135,140 L115,150 Z M285,150 L285,130 L305,140 L285,150 Z" }
      ]}
  ];

  const COLORS = ["#2B2B2B","#FF6B4A","#FFC93C","#4EA8DE","#4CB963","#B79CED","#8B5A2B","#FFFFFF"];

  /* ---------- State ---------- */
  let currentTutId = TUTORIALS[0].id;
  let activeCategory = "todos";
  let activeDifficulty = "todos";
  let drawnUpTo = 0;
  let isPlaying = false;
  let currentColor = COLORS[0];
  let isEraser = false;
  let brushSize = 7;
  let history = [];
  let drawing = false, lastX = 0, lastY = 0;

  function getCurrentTutorial(){
    return TUTORIALS.find(t => t.id === currentTutId);
  }

  /* ---------- Elements ---------- */
  const catFiltersEl = document.getElementById("category-filters");
  const diffFiltersEl = document.getElementById("difficulty-filters");
  const galleryEl = document.getElementById("gallery");
  const guideSvg = document.getElementById("guide-svg");
  const canvas = document.getElementById("draw-canvas");
  const ctx = canvas.getContext("2d");
  const board = document.getElementById("board");
  const dotsEl = document.getElementById("step-dots");
  const playBtn = document.getElementById("play-btn");
  const guideToggle = document.getElementById("guide-toggle");
  const colorsEl = document.getElementById("colors");
  const toastEl = document.getElementById("toast");

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1600);
  }

  /* ---------- Canvas sizing ---------- */
  function fitCanvas(){
    const rect = board.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const prev = document.createElement("canvas");
    prev.width = canvas.width; prev.height = canvas.height;
    const pctx = prev.getContext("2d");
    if(canvas.width>0) pctx.drawImage(canvas,0,0);
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if(prev.width>0){
      ctx.drawImage(prev,0,0,prev.width,prev.height,0,0,rect.width,rect.height);
    }
  }
  window.addEventListener("resize", fitCanvas);

  /* ---------- Filters ---------- */
  function renderFilters(){
    catFiltersEl.innerHTML = "";
    CATEGORIES.forEach(c=>{
      const chip = document.createElement("button");
      chip.className = "chip" + (c.id===activeCategory ? " active":"");
      chip.textContent = c.emoji + " " + c.name;
      chip.addEventListener("click", ()=>{ activeCategory = c.id; renderFilters(); renderGallery(); });
      catFiltersEl.appendChild(chip);
    });
    diffFiltersEl.innerHTML = "";
    DIFFICULTIES.forEach(d=>{
      const chip = document.createElement("button");
      chip.className = "chip diff-" + d.id + (d.id===activeDifficulty ? " active":"");
      chip.textContent = d.name;
      chip.addEventListener("click", ()=>{ activeDifficulty = d.id; renderFilters(); renderGallery(); });
      diffFiltersEl.appendChild(chip);
    });
  }

  /* ---------- Gallery ---------- */
  function thumbSVG(tut){
    const paths = tut.steps.map(s=>`<path d="${s.d}" fill="none" stroke="#2B2B2B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
    return `<svg viewBox="${VB}">${paths}</svg>`;
  }
  function diffDots(diff){
    const levels = { facil:1, medio:2, dificil:3 };
    const n = levels[diff] || 1;
    let html = "";
    for(let i=1;i<=3;i++){
      html += `<i class="${i<=n ? "on "+diff : ""}"></i>`;
    }
    return `<div class="diff-dots">${html}</div>`;
  }
  function renderGallery(){
    galleryEl.innerHTML = "";
    const filtered = TUTORIALS.filter(t =>
      (activeCategory==="todos" || t.category===activeCategory) &&
      (activeDifficulty==="todos" || t.difficulty===activeDifficulty)
    );
    if(filtered.length === 0){
      galleryEl.innerHTML = '<div class="empty-msg">No hay dibujos con esos filtros. ¡Probá otra combinación!</div>';
      return;
    }
    filtered.forEach(tut=>{
      const card = document.createElement("div");
      card.className = "tut-card" + (tut.id===currentTutId ? " active" : "");
      card.innerHTML = thumbSVG(tut) + `<span class="tname">${tut.emoji} ${tut.name}</span>` + diffDots(tut.difficulty);
      card.addEventListener("click", ()=> selectTutorial(tut.id));
      galleryEl.appendChild(card);
    });
  }

  /* ---------- Guide rendering ---------- */
  function buildGuide(){
    guideSvg.innerHTML = "";
    const tut = getCurrentTutorial();
    tut.steps.forEach((s)=>{
      const p = document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d", s.d);
      p.setAttribute("fill","none");
      p.setAttribute("stroke", "#2B2B2B");
      p.setAttribute("stroke-width","7");
      p.setAttribute("stroke-linecap","round");
      p.setAttribute("stroke-linejoin","round");
      p.setAttribute("opacity","0.55");
      guideSvg.appendChild(p);
    });
    renderStatic();
  }

  function pathLength(p){
    try{ return p.getTotalLength(); }catch(e){ return 400; }
  }

  function renderStatic(){
    const paths = guideSvg.querySelectorAll("path");
    paths.forEach((p,i)=>{
      const len = pathLength(p);
      p.style.transition = "none";
      p.setAttribute("stroke-dasharray", len);
      if(i < drawnUpTo){
        p.setAttribute("stroke-dashoffset", 0);
        p.setAttribute("stroke", i === drawnUpTo-1 ? "#FF6B4A" : "#2B2B2B");
      } else {
        p.setAttribute("stroke-dashoffset", len);
      }
    });
    renderDots();
  }

  function renderDots(){
    const tut = getCurrentTutorial();
    dotsEl.innerHTML = "";
    tut.steps.forEach((_,i)=>{
      const d = document.createElement("div");
      d.className = "dot" + (i < drawnUpTo ? (i===drawnUpTo-1 ? " current":" filled") : "");
      d.title = "Paso " + (i+1);
      d.addEventListener("click", ()=>{ stopPlaying(); drawnUpTo = i+1; renderStatic(); });
      dotsEl.appendChild(d);
    });
  }

  function animateStep(i, cb){
    const paths = guideSvg.querySelectorAll("path");
    const p = paths[i];
    const len = pathLength(p);
    const duration = Math.min(2.4, Math.max(0.6, len/260));
    p.setAttribute("stroke", "#FF6B4A");
    p.setAttribute("stroke-dasharray", len);
    p.style.transition = "none";
    p.setAttribute("stroke-dashoffset", len);
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${duration}s linear`;
    requestAnimationFrame(()=>{ p.setAttribute("stroke-dashoffset", 0); });
    setTimeout(()=>{
      p.setAttribute("stroke","#2B2B2B");
      cb && cb();
    }, duration*1000 + 60);
  }

  function playAll(){
    const tut = getCurrentTutorial();
    isPlaying = true;
    playBtn.textContent = "⏸ Pausar";
    drawnUpTo = 0;
    renderStatic();
    let i = 0;
    function step(){
      if(!isPlaying || i >= tut.steps.length){
        isPlaying = false;
        playBtn.textContent = "▶ Ver cómo se dibuja";
        return;
      }
      animateStep(i, ()=>{
        i++;
        drawnUpTo = i;
        renderDots();
        if(!isPlaying) return;
        setTimeout(step, 350);
      });
    }
    step();
  }

  function stopPlaying(){
    isPlaying = false;
    playBtn.textContent = "▶ Ver cómo se dibuja";
  }

  playBtn.addEventListener("click", ()=>{
    if(isPlaying){ stopPlaying(); }
    else { playAll(); }
  });

  document.getElementById("prev-step").addEventListener("click", ()=>{
    stopPlaying();
    drawnUpTo = Math.max(0, drawnUpTo-1);
    renderStatic();
  });
  document.getElementById("next-step").addEventListener("click", ()=>{
    stopPlaying();
    const max = getCurrentTutorial().steps.length;
    drawnUpTo = Math.min(max, drawnUpTo+1);
    renderStatic();
  });
  guideToggle.addEventListener("change", ()=>{
    guideSvg.style.display = guideToggle.checked ? "block" : "none";
  });

  function selectTutorial(id){
    stopPlaying();
    currentTutId = id;
    drawnUpTo = 0;
    renderGallery();
    buildGuide();
    clearCanvas(false);
    toast("Nuevo dibujo: " + getCurrentTutorial().name);
  }

  /* ---------- Drawing tools ---------- */
  function renderColors(){
    colorsEl.innerHTML = "";
    COLORS.forEach((c)=>{
      const b = document.createElement("button");
      b.className = "swatch" + (c===currentColor && !isEraser ? " selected" : "");
      b.style.background = c;
      if(c === "#FFFFFF") b.style.boxShadow = "inset 0 0 0 2px #ddd";
      b.addEventListener("click", ()=>{
        currentColor = c; isEraser = false;
        document.getElementById("eraser-btn").classList.remove("active");
        renderColors();
      });
      colorsEl.appendChild(b);
    });
  }

  document.getElementById("brush-size").addEventListener("input", (e)=>{
    brushSize = parseInt(e.target.value,10);
  });

  document.getElementById("eraser-btn").addEventListener("click", (e)=>{
    isEraser = !isEraser;
    e.target.classList.toggle("active", isEraser);
    renderColors();
  });

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e){
    drawing = true;
    const pos = pointerPos(e);
    lastX = pos.x; lastY = pos.y;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y, brushSize/2, 0, Math.PI*2);
    ctx.fillStyle = isEraser ? "#000000" : currentColor;
    if(isEraser){ ctx.globalCompositeOperation = "destination-out"; }
    else { ctx.globalCompositeOperation = "source-over"; }
    ctx.fill();
  }
  function moveDraw(e){
    if(!drawing) return;
    const pos = pointerPos(e);
    ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = brushSize;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
  }
  function endDraw(){
    if(!drawing) return;
    drawing = false;
    pushHistory();
  }

  canvas.addEventListener("pointerdown", (e)=>{ canvas.setPointerCapture(e.pointerId); startDraw(e); });
  canvas.addEventListener("pointermove", moveDraw);
  canvas.addEventListener("pointerup", endDraw);
  canvas.addEventListener("pointercancel", endDraw);
  canvas.addEventListener("pointerleave", ()=>{ if(drawing) endDraw(); });

  function pushHistory(){
    try{
      history.push(canvas.toDataURL());
      if(history.length > 20) history.shift();
    }catch(e){}
  }

  document.getElementById("undo-btn").addEventListener("click", ()=>{
    if(history.length === 0){ toast("Nada para deshacer"); return; }
    history.pop();
    const rect = board.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    if(history.length){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img,0,0,rect.width,rect.height); };
      img.src = history[history.length-1];
    }
  });

  function clearCanvas(showToast){
    const rect = board.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    history = [];
    if(showToast) toast("Lienzo borrado");
  }
  document.getElementById("clear-btn").addEventListener("click", ()=>clearCanvas(true));

  document.getElementById("save-btn").addEventListener("click", ()=>{
    const rect = board.getBoundingClientRect();
    const out = document.createElement("canvas");
    out.width = rect.width; out.height = rect.height;
    const octx = out.getContext("2d");
    octx.fillStyle = "#FFFBF2";
    octx.fillRect(0,0,out.width,out.height);
    octx.drawImage(canvas,0,0,out.width,out.height);
    const link = document.createElement("a");
    link.download = getCurrentTutorial().name.toLowerCase() + "-dibujo.png";
    link.href = out.toDataURL("image/png");
    link.click();
    toast("¡Dibujo guardado!");
  });

  /* ---------- Init ---------- */
  function init(){
    fitCanvas();
    renderFilters();
    renderGallery();
    renderColors();
    buildGuide();
  }
  window.addEventListener("load", init);
  if(document.readyState === "complete") init();
})();
</script>
